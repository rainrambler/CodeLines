[package]
name = "codelines-gui"
version = "1.0.1"
edition = "2024"
description = "Desktop GUI front-end for the CodeLines analyzer"
authors = ["codelines"]

[dependencies]
codelines = { path = "..", version = "1.0.1" }
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui_extras = { version = "0.37", default-features = false }
rfd = "0.17"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
