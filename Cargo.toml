[workspace]
members = ["gui"]

[package]
name = "codelines"
version = "1.0.1"
edition = "2024"
description = "A code line statistics tool supporting multiple languages and comment analysis"
authors = ["codelines"]

[lib]
name = "codelines"
path = "src/lib.rs"

[[bin]]
name = "codelines"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
colored = "2"
